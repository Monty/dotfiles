colors:
  # Selenized Black palette - sRGB values
  # Background shades
  bg_0:        "#181818"
  bg_1:        "#252525"
  bg_2:        "#3b3b3b"

  # Foreground shades
  dim_0:       "#777777"
  fg_0:        "#b9b9b9"
  fg_1:        "#dedede"

  # Standard colors
  red:         "#ed4a46"
  green:       "#70b433"
  yellow:      "#dbb32d"
  blue:        "#368aeb"
  magenta:     "#eb6eb7"
  cyan:        "#3fc5b7"
  orange:      "#e67f43"
  violet:      "#a580e2"

  # Bright colors
  br_red:      "#ff5e56"
  br_green:    "#83c746"
  br_yellow:   "#efc541"
  br_blue:     "#4f9cfe"
  br_magenta:  "#ff81ca"
  br_cyan:     "#56d8c9"
  br_orange:   "#fa9153"
  br_violet:   "#b891f5"

core:
  normal_text: {}

  regular_file: {}

  reset_to_normal: {}

  directory:
    foreground: br_blue

  symlink:
    foreground: br_magenta
    font-style: italic

  multi_hard_link: {}

  fifo:
    foreground: fg_1
    background: blue

  socket:
    foreground: magenta

  door:
    foreground: violet

  block_device:
    foreground: yellow
    font-style: bold

  character_device:
    foreground: br_yellow

  broken_symlink:
    foreground: fg_1
    background: red
    font-style: bold

  missing_symlink_target:
    foreground: fg_1
    background: red

  setuid:
    foreground: fg_1
    background: red
    font-style: bold

  setgid:
    foreground: bg_0
    background: orange
    font-style: bold

  file_with_capability:
    foreground: bg_0
    background: orange
    font-style: bold

  sticky_other_writable:
    foreground: yellow
    font-style: underline

  other_writable:
    foreground: br_green

  sticky:
    foreground: blue
    font-style: underline

  executable_file: # Files with exec permissions
    foreground: red

text:
  foreground: fg_0

  special: # README
    foreground: yellow
    font-style: underline

  todo:
    foreground: br_green

  licenses:
    foreground: fg_1

  configuration: # .json, .plist, .rgx
    foreground: yellow

    dockerfile:
      foreground: orange

  other: # .txt
    foreground: fg_0

markup: # web: .html, other: .markdown
  foreground: orange

programming:
  foreground: green

  source: # .awk, .go, .js, .lua, .pl, .py, .rs, .sh, .swift
    foreground: br_yellow

    css:
      foreground: orange

  tooling: # .gitignore, .ignore, Makefile, go.mod, setup.py
    foreground: yellow

media: # bitmap: bmp, .ico, .jpg, .png, .tiff, raw: .raw
  foreground: magenta

  audio: # .m4a. .mp3, .wav
    foreground: br_cyan

  video: # .avi, .mp4, .mpg
    foreground: cyan

  fonts: # .ttf, .woff
    foreground: yellow

office: # .doc, .pages, .numbers, .ods, .key, .ics
  foreground: green

  other: # .csv, .tsv
    foreground: fg_0

archives: # .gz, .jar, .tar, .tgz
  foreground: red
  font-style: underline

  images: # .dmg, .iso
    foreground: br_red
    font-style: underline

executable: # .bat, .exe, .so, .dylib (without exec permissions)
  foreground: yellow

  windows:
    foreground: red
    font-style: underline

unimportant: # .DS_Store, .localized, .bak, .orig, package-lock.json
  foreground: dim_0
  font-style: italic
