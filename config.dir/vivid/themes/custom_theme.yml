colors:
  # Original "catppuccin" theme
  # https://github.com/catppuccin/catppuccin
  # modified to my preferred colors

  alt_blue:   '#83a598'
  alt_cyan:   '#70b433'
  alt_red:    '#ed4a46'
  alt_yellow: '#fabd2f'
  float:      '#1e2030'

  rosewater:  '#dc8a78'
  flamingo:   '#dd7878'
  pink:       '#ea76cb'
  mauve:      '#8839ef'
  red:        '#d20f39'
  maroon:     '#e64553'
  peach:      '#fe640b'
  yellow:     '#df8e1d'
  green:      '#40a02b'
  teal:       '#179299'
  sky:        '#04a5e5'
  sapphire:   '#209fb5'
  blue:       '#1e66f5'
  lavender:   '#7287fd'

  text:       '#4c4f69'
  subtext1:   '#5c5f77'
  subtext0:   '#6c6f85'
  overlay2:   '#7c7f93'
  overlay1:   '#8c8fa1'
  overlay0:   '#9ca0b0'
  surface2:   '#acb0be'
  surface1:   '#bcc0cc'
  surface0:   '#ccd0da'

  crust:      '#dce0e8'
  mantle:     '#e6e9ef'
  base:       '#eff1f5'

core:
  normal_text: {}
  regular_file: {}
  reset_to_normal: {}

  directory:
    foreground: blue

  symlink:
    foreground: pink
    font-style: italic

  multi_hard_link: {}

  fifo:
    foreground: crust
    background: blue

  socket:
    foreground: crust
    background: pink

  door:
    foreground: crust
    background: pink

  block_device:
    foreground: yellow

  character_device:
    foreground: alt_yellow

  broken_symlink:
    foreground: crust
    background: red

  missing_symlink_target:
    foreground: crust
    background: red

  setuid: {}

  setgid: {}

  file_with_capability: {}

  sticky_other_writable: {} # Should be a directory

  other_writable: {} # Should be a directory

  sticky: {}

  executable_file: # Files with exec permissions
    foreground: alt_red

text:
  special: # README
    foreground: alt_yellow
    font-style: underline

  todo:
    font-style: bold

  licenses:
    foreground: overlay2

  configuration: # .json, .plist, .rgx
    foreground: yellow

  other: # .txt
    foreground: yellow

markup: # web: .html, other: .markdown
  foreground: yellow

programming:
  source: # .awk, .go, .js, .lua, .pl, .py, .rs, .sh, .swift
    foreground: green

  tooling: # .gitignore, .ignore, Makefile, go.mod, setup.py
    foreground: teal

    continuous-integration:
      foreground: green

media: # bitmap: bmp, .ico, .jpg, .png, .tiff, raw: .raw
  foreground: sky

office: # .doc, .pages, .numbers, .ods, .key, .ics
  foreground: alt_cyan

archives: # .gz, .jar, .tar, .tgz
  foreground: sapphire
  font-style: underline

executable: # .bat, .exe, .so, .dylib (without exec permissions)
  foreground: red
  font-style: bold

unimportant: # .DS_Store, .localized, .bak, .orig, package-lock.json
  foreground: surface2
